name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Validate static application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax and run tests
        run: npm run check
      - name: Verify required files
        run: |
          test -f index.html
          test -f SPEC.md
          test -f AGENTS.md
          test -f css/styles.css
          test -f css/presentation.css
          test -f js/app.js
          test -f js/accessibility.js
          test -f data/scenarios.js
